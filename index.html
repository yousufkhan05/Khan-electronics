<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khan electronics</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- font aw cdn -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <link rel="stylesheet" href="./dist/output.css">
    <!-- google font  -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body class="font-[Open_Sans]  m-0 p-0  overflow-hidden text-[#333E48] ">
    <!-- Header -->
    <header class="">
        <!-- Nav bar  -->
        <nav class="">
            <!-- Large screen -->
            <div class="lg:flex hidden justify-between py-3 px-4 border-b border-slate-300 text-xs ">
                <div>
                    <h3>
                        Wslcome to worldwide electronics Store
                    </h3>
                </div>
                <div class="flex justify-between gap-5 cursor-pointer">
                    <a class="border-r border-slate-300  pr-4 " href="">
                        <i class="fa-solid fa-location-dot"></i>
                        Stor Locator
                    </a>
                    <a class="border-r border-slate-300  pr-4 " href="">
                        <i class="fa-solid fa-truck-fast"></i>
                        Track your Order
                    </a>
                    <a class="border-r border-slate-300  pr-4 " href="">
                        <i class="fa-solid fa-dollar-sign"></i>
                        Dolar (us)<i class="fa-solid fa-angle-down"></i>
                    </a>
                    <a class=" " href="">
                        <i class="fa-regular fa-user"></i>
                        Register or Sihg in
                    </a>
                </div>
            </div>

            <!-- Mobie and tablate screen -->
            <div class="bg-yellow-300 px-4 py-3 flex justify-between  lg:hidden">
                <div class="flex  items-center gap-5 font-extrabold text-3xl">
                    <i class="fa-solid fa-bars"></i>
                    <h1 class="text-4xl">electro</h1>
                </div>

                <div class="flex items-center gap-4">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <i class="fa-regular fa-user"></i>
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
            </div>
        </nav>

        <!-- LOgo and search box -->
        <div class="px-4 lg:flex justify-between mt-10 hidden ">
            <!-- Logo -->
            <div class="flex items-center gap-8 font-extrabold text-3xl">
                <h1 class="text-5xl">electro</h1>
                <i class="fa-solid fa-bars"></i>
            </div>
            <!-- Seareh box -->
            <div class="border-2 border-yellow-400 rounded-full pl-3  flex items-center justify-between gap-2 w-3/6">
                <input type="text" placeholder="Search for Products "
                    class="bg-transparent border-none focus:outline-none pl-4 ">

                <div class="flex items-center gap-8">
                    <h3 class="text-slate-400">
                        All Categories <i class="fa-solid fa-angle-down"></i>
                    </h3>

                    <i class="fa-solid fa-magnifying-glass text-black bg-yellow-400 py-4  px-6 rounded-r-full w-"></i>
                </div>
            </div>

            <!-- Icon -->
            <div class="flex items-center gap-8 text-lg font-semibold">
                <i class="fa-solid fa-rotate"></i>
                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-cart-shopping"></i>
                <h2>$1785.00</h2>
            </div>
        </div>
    </header>
</body>


</html>
